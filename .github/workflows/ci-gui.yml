name: CI gui

# Heavy GUI matrix: runs only when code changes. Docs-only pushes are
# ignored here (and in CI fast) so parallel agents don't burn runner
# minutes on plan edits. Concurrency is per workflow and ref (see CI fast:
# a group shared between the two workflows made their PR runs cancel each
# other); a new push to a PR cancels its outdated run, main runs are kept.
# Any workflow change triggers it too: branch protection requires the
# linux/windows/macos checks, and a workflow-only PR without this run
# could never be merged.
on:
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/**'
      - 'tools/ci/**'
      - 'ci/**'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/**'
      - 'tools/ci/**'
      - 'ci/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # GTK and Qt are loaded at run time through purego, so they are needed
      # for the tests but never linked. Both Qt majors: backends/qt/qttest runs
      # every scenario on Qt 6 and on Qt 5. The translations are what makes
      # a message box say «Да»; xdotool types real keystrokes through the X
      # server. stalonetray is a standalone panel: it is what turns "does the
      # icon dock?" from a question for a human into an assertion.
      - name: Install GTK, Qt 6, Qt 5 and a tray manager
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libglib2.0-0 xvfb stalonetray xdotool \
            scrot \
            libqt6widgets6t64 libqt5widgets5t64 qt6-base-dev qtbase5-dev \
            qt6-translations-l10n qttranslations5-l10n

      # Formatting, vet and cross-compilation live in CI fast; this job
      # keeps the display-dependent checks only.
      - name: Probe Qt 5 and Qt 6 wheel-event ABI
        run: |
          for qt in Qt6Widgets Qt5Widgets; do
            c++ -fPIC ci/qt/canvas_abi_probe.cpp \
              $(pkg-config --cflags --libs "$qt") -o "$RUNNER_TEMP/qt-abi-probe"
            probe_output=$("$RUNNER_TEMP/qt-abi-probe")
            echo "$probe_output"
            case "$qt:$probe_output" in
              Qt6Widgets:*"Qt 6 QWheelEvent angleDelta offset: 88; value: 120"*) ;;
              Qt5Widgets:*"Qt 5 QWheelEvent angleDelta offset: 72; value: 120"*) ;;
              *) echo "Unexpected Qt wheel-event ABI: $probe_output" >&2; exit 1 ;;
            esac
            case "$qt:$probe_output" in
              Qt6Widgets:*"Qt 6 QMouseEvent button/buttons offset: 64"*) ;;
              Qt5Widgets:*"Qt 5 QMouseEvent button/buttons offset: 80"*) ;;
              *) echo "Unexpected Qt mouse-event ABI: $probe_output" >&2; exit 1 ;;
            esac
          done

      # Xvfb gives a display, stalonetray gives a panel, so the GTK and Qt
      # backends and the tray are exercised for real rather than skipped.
      - name: Tests with a display and a panel
        run: xvfb-run -a go test -race -count=1 ./...
        env:
          GOWIDGETS_SNAPSHOT_DIR: ${{ runner.temp }}/snapshots

      - name: Upload GTK screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: error

      - name: Capture pixy window under GTK
        run: |
          mkdir -p "$RUNNER_TEMP/pixy-snapshots"
          go build -o "$RUNNER_TEMP/pixy" ./showcase/pixy
          go run ./showcase/pixy/testfixture "$RUNNER_TEMP/pixy-sample.png"
          xvfb-run -a bash -euo pipefail -c '
            PIXY_SHOW_THUMBNAILS=1 "$RUNNER_TEMP/pixy" "$RUNNER_TEMP/pixy-sample.png" &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            for _ in $(seq 1 50); do
              window_id=$(xdotool search --onlyvisible --name "pixy" 2>/dev/null | head -n1 || true)
              if [ -n "$window_id" ]; then break; fi
              sleep 0.2
            done
            test -n "${window_id:-}"
            xdotool windowraise "$window_id"
            xdotool windowfocus --sync "$window_id"
            sleep 0.5
            xdotool mousemove --window "$window_id" 376 230 click 1
            xdotool keydown ctrl
            xdotool mousemove --window "$window_id" 530 230 click 1
            xdotool keyup ctrl
            sleep 0.2
            scrot "$RUNNER_TEMP/pixy-snapshots/pixy-gtk.png"
            # Switch back to the viewer, rotate the selected image, then
            # exercise undo/redo before capturing the final edited preview.
            xdotool mousemove --window "$window_id" 510 102 click 1
            xdotool mousemove --window "$window_id" 83 144 click 1
            xdotool key --clearmodifiers ctrl+z
            xdotool key --clearmodifiers ctrl+y
            sleep 0.2
            scrot "$RUNNER_TEMP/pixy-snapshots/pixy-gtk-rotate-redo.png"
            xdotool mousemove --window "$window_id" 450 141 click 1
            xdotool key --clearmodifiers ctrl+z
            xdotool key --clearmodifiers ctrl+y
            sleep 0.2
            scrot "$RUNNER_TEMP/pixy-snapshots/pixy-gtk-mirror-redo.png"
            xdotool mousemove --window "$window_id" 600 141 click 1
            xdotool key --clearmodifiers ctrl+z
            xdotool key --clearmodifiers ctrl+y
            sleep 0.2
            scrot "$RUNNER_TEMP/pixy-snapshots/pixy-gtk-mirror-vertical-redo.png"
            xdotool mousemove --window "$window_id" 800 141 click 1
            xdotool mousemove --window "$window_id" 580 285 mousedown 1
            xdotool mousemove --sync --window "$window_id" 750 480
            sleep 0.2
            xdotool mouseup 1
            xdotool mousemove --window "$window_id" 800 141 click 1
            xdotool key --clearmodifiers ctrl+z
            xdotool key --clearmodifiers ctrl+y
            sleep 0.2
            scrot "$RUNNER_TEMP/pixy-snapshots/pixy-gtk-crop-redo.png"
            # Resize the cropped image to a specific width, keep the aspect
            # ratio, and verify that undo/redo restores the resized result.
            xdotool mousemove --window "$window_id" 140 195 click 1 key --clearmodifiers ctrl+a type --clearmodifiers 200
            xdotool mousemove --window "$window_id" 745 195 click 1
            xdotool key --clearmodifiers ctrl+z
            xdotool key --clearmodifiers ctrl+y
            sleep 0.2
            scrot "$RUNNER_TEMP/pixy-snapshots/pixy-gtk-resize-redo.png"
            # Apply a reversible brightness adjustment after resizing.
            xdotool mousemove --window "$window_id" 140 225 click 1 key --clearmodifiers ctrl+a type --clearmodifiers 50
            xdotool mousemove --window "$window_id" 280 225 click 1
            xdotool key --clearmodifiers ctrl+z
            xdotool key --clearmodifiers ctrl+y
            sleep 0.2
            scrot "$RUNNER_TEMP/pixy-snapshots/pixy-gtk-brightness-redo.png"
            xdotool mousemove --window "$window_id" 540 225 click 1
            xdotool key --clearmodifiers ctrl+z
            xdotool key --clearmodifiers ctrl+y
            sleep 0.2
            scrot "$RUNNER_TEMP/pixy-snapshots/pixy-gtk-grayscale-redo.png"
            xdotool mousemove --window "$window_id" 680 225 click 1
            xdotool key --clearmodifiers ctrl+z
            xdotool key --clearmodifiers ctrl+y
            sleep 0.2
            scrot "$RUNNER_TEMP/pixy-snapshots/pixy-gtk-sepia-redo.png"
            xdotool mousemove --window "$window_id" 800 225 click 1
            xdotool key --clearmodifiers ctrl+z
            xdotool key --clearmodifiers ctrl+y
            sleep 0.2
            scrot "$RUNNER_TEMP/pixy-snapshots/pixy-gtk-invert-redo.png"
            xdotool mousemove --window "$window_id" 120 263 click 1 key --clearmodifiers ctrl+a type --clearmodifiers 50
            xdotool mousemove --window "$window_id" 350 263 click 1 key --clearmodifiers ctrl+a key minus 5 0
            xdotool mousemove --window "$window_id" 575 263 click 1 key --clearmodifiers ctrl+a type --clearmodifiers 0
            xdotool mousemove --window "$window_id" 745 263 click 1
            xdotool key --clearmodifiers ctrl+z
            xdotool key --clearmodifiers ctrl+y
            sleep 0.2
            scrot "$RUNNER_TEMP/pixy-snapshots/pixy-gtk-channels-redo.png"
            xdotool mousemove --window "$window_id" 900 263 click 1
            xdotool mousemove --window "$window_id" 666 451 click 1
            xdotool key --clearmodifiers ctrl+z
            xdotool key --clearmodifiers ctrl+y
            sleep 0.2
            scrot "$RUNNER_TEMP/pixy-snapshots/pixy-gtk-red-eye-redo.png"
            xdotool mousemove --window "$window_id" 900 263 click 1
            # Add a frame with the default dark color, then prove the
            # existing Undo/Redo stack restores the exact framed result.
            xdotool mousemove --window "$window_id" 880 103 click 1 key --clearmodifiers ctrl+a type --clearmodifiers "12 #ffcc00"
            xdotool mousemove --window "$window_id" 1030 103 click 1
            xdotool key --clearmodifiers ctrl+z
            xdotool key --clearmodifiers ctrl+y
            sleep 0.2
            scrot "$RUNNER_TEMP/pixy-snapshots/pixy-gtk-frame-color-redo.png"
            xdotool mousemove --window "$window_id" 1045 263 click 1
            xdotool key --clearmodifiers ctrl+z
            xdotool key --clearmodifiers ctrl+y
            sleep 0.2
            scrot "$RUNNER_TEMP/pixy-snapshots/pixy-gtk-shadow-redo.png"
            xdotool mousemove --window "$window_id" 654 103 click 1
            sleep 0.2
            scrot "$RUNNER_TEMP/pixy-snapshots/pixy-gtk-histogram.png"
            xdotool mousemove --window "$window_id" 654 103 click 1
            xdotool key --clearmodifiers Escape
            timeout 10s tail --pid="$app_pid" -f /dev/null
            wait "$app_pid"
          '

      - name: Upload pixy screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixy-gtk-screenshot
          path: ${{ runner.temp }}/pixy-snapshots
          if-no-files-found: error

      # The debug build turns affinity and constraint violations into panics;
      # it has to stay green too, or the diagnostics rot unnoticed.
      - name: Tests, debug build
        run: xvfb-run -a go test -count=1 -tags goWidgets_debug ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: go vet
        run: go vet ./...

      # backends/win32/win32test opens a real window (focus, typing, Enter,
      # Tab) and skips if the runner has no desktop session; the headless
      # driver covers the layout pipeline everywhere.
      - name: Tests
        # GUI packages share desktop-global foreground and mouse-capture state.
        # Run them serially, and disable Go's test cache so the first-frame and
        # delayed-checkbox screenshot gate actually runs on every CI invocation.
        run: go test -p 1 -count=1 ./...
        env:
          GOWIDGETS_SNAPSHOT_DIR: ${{ runner.temp }}/snapshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: error

      - name: Build as a GUI application
        run: go build -ldflags="-H windowsgui" -o crescent.exe ./showcase/crescent
        env:
          CGO_ENABLED: 0

      - name: Build pixy as a GUI application
        run: go build -ldflags="-H windowsgui" -o pixy.exe ./showcase/pixy
        env:
          CGO_ENABLED: 0

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: go vet
        run: go vet ./...

      # The runner has a logged-in GUI session, so backends/cocoa/cocoatest
      # opens real AppKit windows, alerts, panels and a status item. The
      # snapshot is the controls window rendered by AppKit itself, kept as
      # an artifact for a human to look at.
      - name: Cocoa tests
        run: |
          mkdir -p "$RUNNER_TEMP/snapshots"
          go test -v -count=1 ./backends/cocoa/...
        env:
          GOWIDGETS_SNAPSHOT_DIR: ${{ runner.temp }}/snapshots

      - name: Tests
        run: go test -count=1 ./...

      - name: Build the showcase
        run: go build -o /tmp/crescent ./showcase/crescent
        env:
          CGO_ENABLED: 0

      - name: Build pixy
        run: go build -o /tmp/pixy ./showcase/pixy
        env:
          CGO_ENABLED: 0

      - name: Capture pixy window under Cocoa
        run: |
          mkdir -p "$RUNNER_TEMP/pixy-snapshots"
          go run ./showcase/pixy/testfixture "$RUNNER_TEMP/pixy-sample.png"
          PIXY_SHOW_THUMBNAILS=1 /tmp/pixy "$RUNNER_TEMP/pixy-sample.png" &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          swift tools/ci/capture-pixy-macos.swift "$app_pid" "$RUNNER_TEMP/pixy-snapshots/pixy-cocoa.png"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixy-cocoa-screenshot
          path: ${{ runner.temp }}/pixy-snapshots
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: error
