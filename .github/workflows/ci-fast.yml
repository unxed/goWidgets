name: CI fast

# Quick gate without a display or system toolkits: formatting, vet,
# toolkit-independent tests and cross-compilation. GUI tests detect the
# missing DISPLAY and skip, so this stays green and fast (~1-2 min).
# Docs-only pushes are ignored so plan edits don't queue runner time.
# Concurrency is per workflow and ref: groups are repository-wide, so a
# group shared with CI gui made the two PR runs cancel each other (the
# required `fast` check ended up cancelled on every code PR). A new push
# to a PR cancels that PR's outdated run; main runs are never cancelled.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'spec/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'spec/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...

      # No Xvfb here: backends tests skip without DISPLAY, while core,
      # layout and pixy pixel/viewport/grid tests run for real.
      - name: Tests without display
        run: go test -count=1 ./...

      - name: Tests without display, debug build
        run: go test -count=1 -tags goWidgets_debug ./core/... ./showcase/...

      - name: Cross-compile
        run: |
          set -e
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            flags="-s -w"
            [ "$os" = windows ] && flags="$flags -H windowsgui"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="$flags" -o /tmp/out ./showcase/crescent
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="$flags" -o /tmp/pixy ./showcase/pixy
            echo "  $target ok"
          done

      # showcase/zipgui is a module of its own (ADR-0019): the ./... steps
      # above never reach it, so it gets the same gates here, explicitly.
      - name: zipgui vet and tests
        working-directory: showcase/zipgui
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          go test -count=1 ./...

      # Same targets as crescent and pixy, plus the disdoc §1.3 NFR: a
      # showcase binary stays under 25 MB (zipper brings its own codecs).
      - name: zipgui cross-compile and binary size
        working-directory: showcase/zipgui
        run: |
          set -e
          limit=$((25 * 1024 * 1024))
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            flags="-s -w"
            [ "$os" = windows ] && flags="$flags -H windowsgui"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="$flags" -o /tmp/zipgui .
            size=$(stat -c %s /tmp/zipgui)
            echo "  $target ok, $size bytes"
            if [ "$size" -ge "$limit" ]; then
              echo "::error::zipgui $target is $size bytes, the NFR limit is $limit"
              exit 1
            fi
          done

      # Last on purpose: when it fails, the steps above have already said
      # whether the code builds, and the diff printed here is the fix.
      - name: zipgui go.mod and go.sum are tidy
        working-directory: showcase/zipgui
        run: go mod tidy -diff

      # The web backend (ADR-0018) builds only under the js && wasm tag,
      # so the steps above never compile it. Build and vet it for its real
      # target so a broken W1+ driver fails here instead of in a browser.
      - name: WebAssembly build (backends/web)
        run: |
          CGO_ENABLED=0 GOOS=js GOARCH=wasm go build ./backends/web/...
          CGO_ENABLED=0 GOOS=js GOARCH=wasm go vet ./backends/web/...
          CGO_ENABLED=0 GOOS=js GOARCH=wasm go test -c -o /tmp/web.test.wasm ./backends/web/...
